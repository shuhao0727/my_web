# MyWeb 开发模式配置 (AMD64架构)
# 前端使用6608端口，后端内部使用8000端口，Nginx代理外部访问
# 部署命令: docker-compose -f docker-compose.dev.amd64.yml up -d

version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      platform: linux/amd64
    container_name: myweb_backend_dev_amd64
    platform: linux/amd64
    environment:
      - APP_ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=sqlite:///xbk.db
      - AI_DATABASE_URL=sqlite:///znt.db
      - XBK_DB_PATH=/xbk.db
      - ZNT_DB_PATH=/znt.db
      - XBK_JWT_SECRET_KEY=myweb-xbk-secret-key
      - JWT_SECRET_KEY=myweb-jwt-secret-key
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - WANGSHU_USERNAME=wangshu0727
      - WANGSHU_PASSWORD=wangshu123
      - CONTENT_DIR=/content
      - GITHUB_REPO_NAME=2-My-notes
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:6608,http://nginx:6608}
    volumes:
      - ./backend:/app
      - ./backend/content:/content
      - /app/__pycache__
    ports:
      - "8000:8000"  # 开发时暴露后端端口用于调试
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.request
          import json
          try:
              with urllib.request.urlopen('http://localhost:8000/health', timeout=5) as response:
                  data = json.loads(response.read().decode())
                  if data.get('status') == 'healthy':
                      sys.exit(0)
                  else:
                      sys.exit(1)
          except Exception as e:
              print(f"Health check failed: {e}")
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - '8000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      platform: linux/amd64
    container_name: myweb_frontend_dev_amd64
    platform: linux/amd64
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    ports:
      - "3000:3000"  # 开发时暴露前端端口
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - '3000'

  nginx:
    image: nginx:alpine
    container_name: myweb_nginx_dev_amd64
    platform: linux/amd64
    ports:
      - "6608:6608"  # 开发模式使用6608端口
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped