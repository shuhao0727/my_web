# MyWeb 一键部署配置 - amd64架构
# 使用已发布的AMD64架构Docker镜像
# 镜像: shuhao07/my_web-backend:latest-amd64, shuhao07/my_web-frontend:latest-amd64
# 部署命令: docker-compose -f docker-compose-deploy-simple.yml up -d

version: '3.8'

services:
  # 后端API服务
  backend:
    image: shuhao07/my_web-backend:latest-amd64
    container_name: myweb_backend
    ports:
      - "8000:8000"
    environment:
      # 基本配置
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      
      # 数据库配置
      - DATABASE_URL=sqlite:///data/xbk.db
      - AI_DATABASE_URL=sqlite:///data/znt.db
      - XBK_DB_PATH=/data/xbk.db
      - ZNT_DB_PATH=/data/znt.db
      
      # JWT密钥（必须配置）
      - XBK_JWT_SECRET_KEY=${XBK_JWT_SECRET_KEY:-change-this-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      
      # 用户账户
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - WANGSHU_USERNAME=wangshu0727
      - WANGSHU_PASSWORD=wangshu123
      
      # 内容目录
      - CONTENT_DIR=/data/content
      
      # CORS配置
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:6608,*
    volumes:
      - backend_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端Web服务
  frontend:
    image: shuhao07/my_web-frontend:latest-amd64
    container_name: myweb_frontend
    ports:
      - "6608:3000"  # 主机端口6608映射到容器端口3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data: