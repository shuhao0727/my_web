# 生产环境配置
version: '3.8'

# 网络配置
networks:
  myweb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  typst-content:
    driver: local
  backend-data:
    driver: local
  frontend-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  articles-content:
    driver: local

# 服务定义
services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: myweb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - myweb-network
    volumes:
      - redis-data:/data
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendfsync everysec
      --activerehashing yes
      --maxclients 10000
      --tcp-keepalive 300
      --timeout 0
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # PostgreSQL数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: myweb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=myweb
      - POSTGRES_USER=myweb_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myweb_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    ports:
      - "5432:5432"
    networks:
      - myweb-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myweb_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # 后端服务 (FastAPI + Python 3.11) - 生产环境
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-prod.txt
        HTTP_PROXY: http://192.168.5.79:7897
        HTTPS_PROXY: http://192.168.5.79:7897
    container_name: myweb-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - myweb-network
    volumes:
      - typst-content:/app/content
      - backend-data:/app/data
      - articles-content:/app/content/wz
      # 生产环境不挂载源代码，使用构建好的镜像
    environment:
      # 应用配置
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      
      # Redis缓存配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_TTL=300
      
      # 数据库配置
      - DATABASE_URL=postgresql://myweb_user:${POSTGRES_PASSWORD:-myweb_password}@postgres:5432/myweb
      - AI_DATABASE_URL=postgresql://myweb_user:${POSTGRES_PASSWORD:-myweb_password}@postgres:5432/ai_db
      - XBK_DATABASE_URL=postgresql://myweb_user:${POSTGRES_PASSWORD:-myweb_password}@postgres:5432/xbk
      - XBK_DB_PATH=/app/data/xbk.db
      - ZNT_DB_PATH=/app/data/znt.db
      - CONTENT_DIR=/app/content
      
      # GitHub同步配置
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-shuhao0727}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-2-My-notes}
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH:-main}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-86400}
      - ENABLE_AUTO_SYNC=${ENABLE_AUTO_SYNC:-true}
      
      # 管理员账户配置
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - WANGSHU_USERNAME=${WANGSHU_USERNAME:-wangshu0727}
      - WANGSHU_PASSWORD=${WANGSHU_PASSWORD:-wangshu123}
      
      # AI服务配置（可选）
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - DIFY_APP_ID=${DIFY_APP_ID:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      
      # CORS配置
      - CORS_ORIGINS=http://localhost:3000,http://localhost:6608,http://frontend:6608
      
      # 安全配置
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # 并发优化配置
      - WORKERS_PER_CORE=2
      - WEB_CONCURRENCY=4
      - MAX_WORKERS=8
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo '🚀 启动MyWeb后端服务（生产环境）...' &&
        echo '📁 检查数据目录...' &&
        mkdir -p /app/content /app/data &&
        echo '🗄️ 初始化数据库...' &&
        python init_databases.py &&
        echo '🔧 启动FastAPI服务...' &&
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
        reservations:
          memory: 768M
          cpus: '0.5'

  # 前端服务 (Next.js + Node.js 20) - 生产环境
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: myweb-frontend-prod
    restart: unless-stopped
    ports:
      - "6608:6608"
    networks:
      - myweb-network
    volumes:
      - frontend-data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=6608
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6608"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: node server.js
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

# 生产环境优化说明：
# 1. 使用生产环境构建：前端使用production阶段，后端使用requirements-prod.txt
# 2. 移除开发配置：DEBUG=false，ENVIRONMENT=production
# 3. 移除热重载：后端不使用--reload参数
# 4. 移除源代码挂载：使用构建好的镜像
# 5. 优化资源限制：根据生产需求调整
# 6. 启用健康检查：确保服务可用性
# 7. 日志配置：限制日志大小，防止磁盘占满