# 网络配置
networks:
  myweb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  # Typst文档内容卷（从GitHub同步的文档）
  typst-content:
    driver: local
  # 后端数据卷（包含数据库文件）
  backend-data:
    driver: local
  # 前端数据卷
  frontend-data:
    driver: local

# 服务定义
services:
  # ==================== 后端服务 (FastAPI + Python 3.13) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 构建参数
        PYTHON_VERSION: 3.11
        POETRY_VERSION: 1.7.0
    container_name: myweb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"  # FastAPI开发端口
      - "5678:5678"  # 调试端口（可选）
    networks:
      - myweb-network
    volumes:
      # 数据持久化卷 - 改为目录挂载
      - typst-content:/app/content
      - backend-data:/app/data
      # 开发模式：绑定挂载源代码（便于热重载）
      - ./backend:/app/code
    environment:
      # 应用配置
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      
      # 数据库配置 - 更新路径到数据目录
      - DATABASE_URL=sqlite:////app/data/xbk.db
      - AI_DATABASE_URL=sqlite:////app/data/znt.db
      - XBK_DATABASE_URL=sqlite:////app/data/xbk.db
      - XBK_DB_PATH=/app/data/xbk.db
      - ZNT_DB_PATH=/app/data/znt.db
      - CONTENT_DIR=/app/code/content
      
      # GitHub同步配置
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-shuhao0727}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-2-My-notes}
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH:-main}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-86400}
      - ENABLE_AUTO_SYNC=${ENABLE_AUTO_SYNC:-true}
      
      # 管理员账户配置
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - WANGSHU_USERNAME=${WANGSHU_USERNAME:-wangshu0727}
      - WANGSHU_PASSWORD=${WANGSHU_PASSWORD:-wangshu123}
      
      # AI服务配置（可选）
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - DIFY_APP_ID=${DIFY_APP_ID:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      
      # CORS配置
      - CORS_ORIGINS=http://localhost:3000,http://localhost:6608,http://frontend:6608
      
      # 安全配置
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    env_file:
      - .env  # 从.env文件加载环境变量
    depends_on:
      # 后端不依赖其他服务，但可以添加健康检查
      - health-checker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo '🚀 启动MyWeb后端服务...' &&
        echo '📁 检查数据目录...' &&
        mkdir -p /app/content /app/data &&
        echo '🔗 创建数据库符号链接...' &&
        ln -sf /app/data/znt.db /app/code/znt.db &&
        ln -sf /app/data/xbk.db /app/code/xbk.db &&
        echo '🗄️  初始化数据库...' &&
        cd /app/code &&
        python init_databases.py &&
        echo '🔧 启动FastAPI服务...' &&
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== 前端服务 (Next.js + Node.js 20) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # 使用开发阶段
      args:
        NODE_VERSION: 20
    container_name: myweb-frontend
    restart: unless-stopped
    ports:
      - "6608:6608"  # Next.js开发端口
      - "9229:9229"  # Node.js调试端口（可选）
    networks:
      - myweb-network
    volumes:
      # 数据卷
      - frontend-data:/app/data
      # 开发模式：绑定挂载源代码
      - ./frontend:/app
      - /app/node_modules  # 匿名卷，防止主机node_modules覆盖
      - /app/.next  # 匿名卷，缓存构建结果
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=6608
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      - NEXT_DISABLE_HYDRATION_WARNING=1
      - SUPPRESS_HYDRATION_WARNING=1
      - DISABLE_GOOGLE_TRANSLATE=1
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6608"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      sh -c "
        echo '🚀 启动MyWeb前端服务...' &&
        echo '📦 检查Node.js依赖...' &&
        if [ ! -d '/app/node_modules' ]; then
          echo '安装依赖...' &&
          npm install
        fi &&
        echo '🔧 启动Next.js开发服务器...' &&
        npm run dev
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== 健康检查服务（简化版） ====================
  health-checker:
    image: alpine:latest
    container_name: myweb-health-checker
    networks:
      - myweb-network
    command: >
      sh -c "
        echo '⏳ 等待服务启动...' &&
        sleep 5 &&
        echo '✅ 健康检查服务就绪'
      "
    restart: "no"

# ==================== 扩展配置说明 ====================
# 1. 生产环境使用：复制此文件为docker-compose.prod.yml并修改：
#    - 移除开发绑定挂载（volumes中的源代码挂载）
#    - 更改环境变量：ENVIRONMENT=production, DEBUG=false
#    - 添加Nginx反向代理服务
#    - 调整资源限制
#    - 移除热重载（--reload参数）
#
# 2. 数据库备份：可通过cron任务定期备份数据卷
#    docker run --rm -v xbk-database:/data -v $(pwd)/backups:/backup alpine tar czf /backup/xbk-$(date +%Y%m%d).tar.gz -C /data .
#
# 3. 监控建议：可添加Prometheus、Grafana等服务
#
# 4. 网络隔离：生产环境应考虑更严格的网络策略