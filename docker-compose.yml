

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: myweb_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=sqlite:///./xbk.db
      - AI_DATABASE_URL=sqlite:///./znt.db
      - CONTENT_DIR=./content
      - LOG_LEVEL=INFO
      - DB_POOL_SIZE=20
      - DB_POOL_OVERFLOW=10
      - DB_ECHO=false
    volumes:
      - ./backend/content:/app/content
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: myweb_frontend
    ports:
      - "6608:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:8000
      - PORT=3000
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_data:
