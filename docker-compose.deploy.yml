version: '3.8'

services:
  # Nginx反向代理（可选，如果需要）
  nginx:
    image: nginx:alpine
    container_name: myweb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./deploy/nginx/ssl:/etc/nginx/ssl
      - ./deploy/nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - myweb-network

  # 后端服务 - 从Docker Hub拉取（使用版本化标签1.0.0）
  backend:
    image: ${DOCKER_HUB_USERNAME:-shuhao07}/my_web-backend:1.0.0
    container_name: myweb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CONTENT_DIR=/app/content
      - DATABASE_URL=sqlite:////app/xbk.db?check_same_thread=False
      - AI_DATABASE_URL=sqlite:////app/znt.db?check_same_thread=False
      - XBK_DATABASE_URL=sqlite:////app/xbk.db?check_same_thread=False
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME}
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-21600}
      - ENABLE_AUTO_SYNC=${ENABLE_AUTO_SYNC:-true}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_APP_ID=${DIFY_APP_ID}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_string}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:443,http://nginx
    volumes:
      - xbk-database:/app/xbk.db
      - znt-database:/app/znt.db
      - backend-logs:/app/logs
      - backend-backups:/app/backups
      - ./content:/app/content
    networks:
      - myweb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务 - 从Docker Hub拉取（使用版本化标签1.0.0）
  frontend:
    image: ${DOCKER_HUB_USERNAME:-shuhao07}/my_web-frontend:1.0.0
    container_name: myweb-frontend
    restart: unless-stopped
    ports:
      - "6608:6608"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
      - PORT=6608
      - HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - myweb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6608"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 网络配置
networks:
  myweb-network:
    driver: bridge

# 卷配置（用于数据持久化）
volumes:
  xbk-database:
    name: myweb-xbk-database
  znt-database:
    name: myweb-znt-database
  backend-logs:
    name: myweb-backend-logs
  backend-backups:
    name: myweb-backend-backups