# Nginx 开发模式配置
# 监听6608端口，前端使用3000端口，后端使用8000端口

events {
    worker_connections 1024;
}

http {
    # 上游服务定义
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 6608;  # 开发模式使用6608端口
        
        # API请求代理到后端 - 保留完整路径
        location /api/ {
            # AI智能体路由智能处理（与生产环境保持一致）
            # 处理一级路由尾部斜杠：/api/ai/xxx -> /api/ai/xxx/
            if ($request_uri ~ ^/api/ai/(agents|auth|conversations|chat)(\?.*)?$) {
                return 301 /api/ai/$1/$2;
            }
            
            # 特殊重定向：/api/ai/user-management -> /api/ai/user-management/users
            if ($request_uri ~ ^/api/ai/user-management(/)?(\?.*)?$) {
                set $query_args '';
                if ($is_args) {
                    set $query_args $is_args$args;
                }
                return 301 /api/ai/user-management/users$query_args;
            }
            
            # 特殊重定向：/api/ai/data -> /api/ai/data/stats（如果包含参数）
            if ($request_uri ~ ^/api/ai/data(/)?(\?.*)?$) {
                set $query_args '';
                if ($is_args) {
                    set $query_args $is_args$args;
                }
                return 301 /api/ai/data/stats$query_args;
            }
            
            proxy_pass http://backend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 中文字符支持 (已解决中文路径问题，保持基本配置)
            proxy_set_header Accept-Encoding "";
        }

        # 静态内容代理
        location /content/ {
            proxy_pass http://backend/content/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端应用代理
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "upgrade";
            proxy_set_header Upgrade $http_upgrade;
        }
    }
}