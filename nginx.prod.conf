# Nginx 生产模式配置
# 监听6608端口，后端不对外暴露，统一代理管理

events {
    worker_connections 1024;
}

http {
    # 上游服务定义 - 使用服务名称，不对外暴露端口
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 6608;  # 生产环境使用6608端口
        
        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # AI智能体API代理 - 在Nginx层面处理重定向，避免循环
        
        # 处理/ai/前缀的请求（前端使用的路径）
        location ~ ^/ai/(.*)$ {
            # 将/ai/重写为/api/ai/，然后代理到后端
            rewrite ^/ai/(.*)$ /api/ai/$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 正确处理后端返回的重定向
            proxy_redirect http://backend:8000/ http://$host:$server_port/;
            proxy_redirect http://localhost:6608/ http://$host:$server_port/;
        }
        
        # 处理/api/ai/前缀的请求（后端API）
        location /api/ai/ {
            # 保存原始请求URI
            set $original_uri $request_uri;
            
            # 处理一级路由（没有尾部斜杠的情况）：添加斜杠并保留查询参数
            # 使用$request_uri而不是$uri，因为$request_uri包含查询参数
            if ($request_uri ~ ^/api/ai/(agents|auth|conversations|chat)(?!/|$)(\?.*)?$) {
                # 使用$is_args$args保留查询参数
                rewrite ^/api/ai/(agents|auth|conversations|chat)(?!/|$)(\?.*)?$ /api/ai/$1/$is_args$args break;
            }
            
            # 处理user-management重定向到users
            if ($request_uri ~ ^/api/ai/user-management/?(\?.*)?$) {
                rewrite ^/api/ai/user-management/?(\?.*)?$ /api/ai/user-management/users$is_args$args break;
            }
            
            # 处理data重定向到stats
            if ($request_uri ~ ^/api/ai/data/?(\?.*)?$) {
                rewrite ^/api/ai/data/?(\?.*)?$ /api/ai/data/stats$is_args$args break;
            }
            
            proxy_pass http://backend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $original_uri;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 正确处理后端返回的重定向
            # 将后端返回的重定向URL中的backend:8000替换为localhost:6608
            proxy_redirect http://backend:8000/ http://$host:$server_port/;
            proxy_redirect http://localhost:6608/ http://$host:$server_port/;
        }

        # Typst内容API代理 - 增加超时时间以处理Typst编译
        location /api/typst/ {
            proxy_pass http://backend/api/typst/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 仓库同步API代理 - 增加超时时间以处理Git操作
        location /api/repo/ {
            proxy_pass http://backend/api/repo/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # XBK应用API代理
        location /api/xbk/ {
            proxy_pass http://backend/api/xbk/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 主API代理 - 通用API路由
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            proxy_redirect off;
            proxy_hide_header X-Powered-By;
            add_header X-Proxy-Cache "BYPASS";
            
            # 中文字符支持 (已解决中文路径问题，保持基本配置)
            proxy_set_header Accept-Encoding "";
        }

        # 静态内容代理
        location /content/ {
            proxy_pass http://backend/content/;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 静态文件缓存策略
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # 前端应用代理 - 所有非API请求
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 前端性能优化
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}